name: Macroxel Auto Update
on:
  push:
    paths: ['.macroxel/apply.patch']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macroxel-auto-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          PATCH='.macroxel/apply.patch'
          [ -s "$PATCH" ] || exit 0
          if git apply --check --whitespace=nowarn "$PATCH"; then git apply --whitespace=nowarn "$PATCH"; elif git apply --reverse --check --whitespace=nowarn "$PATCH"; then exit 0; else echo '::error::Actualización incompatible; index.html quedó intacto.'; exit 1; fi
          git config user.name 'Macroxel Updater'
          git config user.email 'macroxel-updater@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Macroxel: actualización automática'
          git push
