name: Macroxel Release
on:
  push:
    paths: ['.macroxel/release.patch.gz.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          base64 -d .macroxel/release.patch.gz.b64 | gzip -d > /tmp/macroxel.patch
          if git apply --check --whitespace=nowarn /tmp/macroxel.patch; then git apply --whitespace=nowarn /tmp/macroxel.patch; elif git apply --reverse --check --whitespace=nowarn /tmp/macroxel.patch; then exit 0; else echo '::error::Release incompatible; index.html intacto.'; exit 1; fi
          git config user.name 'Macroxel Updater'; git config user.email 'macroxel-updater@users.noreply.github.com'
          git add index.html; git diff --cached --quiet && exit 0
          git commit -m 'Macroxel v1.0.1'; git push
